name: school_management_system
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^17.5.0
  path_provider: ^2.1.6
  flutter_screenutil: ^5.9.3
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: 9.2.2
  intl: ^0.20.2
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  build_runner: ^2.15.1
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  flutter_localizations:
    sdk: flutter
  syncfusion_flutter_datepicker: ^34.2.5
  permission_handler: ^13.0.2
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  share_plus: ^12.0.2
  file_picker: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  freezed: ^3.2.5

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/splash_logo_dark.png
    - assets/images/splash_logo.png
    - assets/images/splash_logo_android12.png
    - assets/images/splash_logo_dark_android12.png
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
